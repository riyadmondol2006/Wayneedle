name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Wayneedle works offline, ships without analytics or third-party SDKs, and stores no raw location data.
        Its only network use is the optional update check; requests that need a network connection will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This does not need a network connection, analytics or a third-party SDK.
          required: true
